    <!-- Google tag (gtag.js). send_page_view disabled — pageviews are
         fired manually per route in App.jsx since this is a SPA. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-907CD1S8K9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-907CD1S8K9', { send_page_view: false });
    </script>
    <!-- Single Page Apps for GitHub Pages: restore the real path that
         404.html encoded into the query string, before React mounts.
         https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
